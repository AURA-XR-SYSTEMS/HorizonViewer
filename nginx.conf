server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression (text formats only - mp4/webp/avif are already compressed)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;

    # Allow embedding in iframes from any origin
    add_header X-Frame-Options "" always;
    add_header Content-Security-Policy "frame-ancestors *" always;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (byte-range serving stays on nginx's default: enabled)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header at this level drops server-level headers, so repeat them
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }
}
